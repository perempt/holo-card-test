<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Holographic Card</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      height: 100vh;
      background: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: sans-serif;
    }
    .card-container {
      perspective: 1000px;
    }
    .card {
      width: 300px;
      height: 420px;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.1s ease;
      cursor: pointer;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      z-index: 0;
      position: relative;
      transition: transform 0.1s ease;
    }
    .holo-overlay {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image: url('https://uploads-ssl.webflow.com/622952100c135e4f77562f52/622963e2de7b7e577c3b5b7e_Sparkles.gif');
      background-size: cover;
      mix-blend-mode: screen;
      opacity: 0.9;
      z-index: 1;
    }
    .light-effect {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(circle at center, rgba(250,230,182,0.2) 0%, transparent 30%);
      mix-blend-mode: overlay;
      opacity: 0;
      z-index: 2;
      transition: opacity 0.2s ease;
    }

    /* Foil-like Specular Effect */
    .foil-effect {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.3) 0%, transparent 60%);
      mix-blend-mode: overlay;
      opacity: 0;
      z-index: 3;
      transition: opacity 0.2s ease;
    }
    .nav-button {
      display: inline-block;
      padding: 12px 24px;
      margin-top: 20px;
      font-size: 16px;
      color: white;
      background-color: #1e90ff;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .nav-button:hover {
      background-color: #0d6efd;
    }
  </style>
</head>
<body>
  <div class="card-container">
    <div class="card" id="card">
      <img src="https://i.imgur.com/8u05aKo.png" alt="Card Image" />
      <div class="holo-overlay"></div>
      <div class="light-effect" id="lightEffect"></div>
      <div class="foil-effect" id="foilEffect"></div>
    </div>
  </div>

  <script>
    const card = document.getElementById('card');
    const lightEffect = document.getElementById('lightEffect');
    const holoOverlay = document.querySelector('.holo-overlay');
    const foilEffect = document.getElementById('foilEffect');

    function applyCardRotation(cardElement, e) {
      const rect = cardElement.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = -(y - centerY) / 10;
      const rotateY = (x - centerX) / 10;
      cardElement.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

      const percentX = x / rect.width;
      const percentY = y / rect.height;
      lightEffect.style.background = `radial-gradient(circle at ${percentX * 100}% ${percentY * 100}%, rgba(255,255,255,0.15) 0%, transparent 30%)`;
      lightEffect.style.opacity = 1;

      // Parallax effect for holo-overlay
      holoOverlay.style.transform = `translate3d(${percentX * 10}px, ${percentY * 10}px, 0)`;

      // Foil-like effect based on light position
      foilEffect.style.opacity = 1;
      foilEffect.style.background = `radial-gradient(circle at ${percentX * 100}% ${percentY * 100}%, rgba(255,255,255,0.3) 0%, transparent 60%)`;
    }

    function resetRotation(cardElement) {
      cardElement.style.transform = 'rotateX(0deg) rotateY(0deg)';
      lightEffect.style.opacity = 0;
      holoOverlay.style.transform = 'translate3d(0, 0, 0)';
      foilEffect.style.opacity = 0;
    }

    card.addEventListener('mousemove', (e) => applyCardRotation(card, e));
    card.addEventListener('mouseleave', () => resetRotation(card));
  </script>
  <a href="../index.html" class="nav-button">Back to 1st version</a>
</body>
</html>
